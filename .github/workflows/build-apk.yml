
name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      
      - name: Generate debug keystore and print SHA-1
        run: |
          mkdir -p "$HOME/.config/.android"
          keytool -genkeypair \
            -keystore "$HOME/.config/.android/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias AndroidDebugKey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cd android
          ./gradlew signingReport

      - name: Verify Android preferences bridge version
        run: |
          version="$(flutter pub deps --style=compact | awk '$2 == "shared_preferences_android" { print $3; exit }')"
          if [ "$version" != "2.4.28" ]; then
            echo "::error::Expected shared_preferences_android 2.4.28, got ${version:-missing}"
            exit 1
          fi
          echo "Using shared_preferences_android $version"

      - name: Format Dart files
  run: dart format lib test

      - name: Check Dart formatting
  run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter test \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Validate Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL is missing or empty"
            exit 1
          fi
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::SUPABASE_PUBLISHABLE_KEY is missing or empty"
            exit 1
          fi
          echo "Both Supabase secrets are present."

      - name: Verify Supabase URL and publishable key belong together
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set +x
          endpoint="${SUPABASE_URL%/}/auth/v1/settings"
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 20 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_PUBLISHABLE_KEY" \
            "$endpoint"); then
            echo "::error::Could not reach the configured Supabase Auth endpoint."
            exit 1
          fi
          if [ "$status" != "200" ]; then
            echo "::error::Supabase rejected the configured URL/key pair (HTTP $status). No credentials were logged."
            exit 1
          fi
          echo "Supabase Auth accepted the configured URL/key pair."

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Verify release APK
        run: test -s build/app/outputs/flutter-apk/app-release.apk

      - name: Verify release APK network permission
        run: |
          set -eu
          aapt="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -n 1)"
          test -x "$aapt"
          "$aapt" dump permissions build/app/outputs/flutter-apk/app-release.apk | grep -Fq 'android.permission.INTERNET'
          echo "Release APK includes android.permission.INTERNET."

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: my-notes-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
